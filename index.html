<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The TIBS Boyfriend Experience</title>
<style>
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#fff;color:#341b2d}.wrap{max-width:680px;margin:auto;padding:18px}.hero,.final{background:linear-gradient(145deg,#fff4f8,#fff9fc);border:1px solid #f3d8e4;border-radius:28px;padding:28px 20px;text-align:center}.eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#a66b83;font-weight:800}h1{font-size:clamp(30px,9vw,48px);line-height:1.02;margin:10px 0;font-weight:900}h2{font-size:25px;line-height:1.12;margin:10px 0 14px}p{line-height:1.6}.big{font-size:20px;font-weight:800}.heart{font-size:44px;display:block}.btn,.choice{font:inherit;min-height:50px;border-radius:16px;padding:12px 16px;font-weight:800;cursor:pointer}.btn{border:0;background:#e94f86;color:white;width:100%;margin-top:16px}.btn.alt{background:#fff;color:#341b2d;border:1px solid #e8cbd8}.choice{display:block;width:100%;text-align:left;background:#fff9fb;border:1px solid #eed7e0;margin:9px 0;color:#341b2d}.choice:disabled{opacity:.7}.progress{height:8px;background:#f2dce5;border-radius:99px;overflow:hidden;margin:0 0 20px}.bar{height:100%;background:#e94f86;transition:width .3s}.card{background:#fff;border:1px solid #efd8e2;border-radius:22px;padding:20px;margin-top:14px}.badge{display:inline-block;padding:7px 10px;border-radius:99px;background:#fff1c9;color:#7a5611;font-size:12px;font-weight:800;margin:4px}.tiny{font-size:13px;color:#856979;min-height:22px}.shake{animation:shake .35s}@keyframes shake{25%{transform:translateX(-5px)}50%{transform:translateX(5px)}75%{transform:translateX(-3px)}}@media(prefers-reduced-motion:reduce){.shake{animation:none}.bar{transition:none}}
</style></head><body><main class="wrap"><div id="screen" class="hero"></div></main>
<script>
(()=>{const screen=document.getElementById("screen");const stages=[
["quiz","Level 1 — How We Started 💕","Where did this whole love story begin?",["Instagram","Snapchat 👻","TikTok","At the supermarket 😂"],1,"Correctttt. Snapchat really started all this. 👻❤️","Boyfriend??? Think carefully. 😭"],
["quiz","Level 2 — The Date Test 📅","When did we start talking?",["October 13, 2024 ❤️","January 9, 2025","February 14, 2025","Some random Tuesday"],0,"YES. October 13, 2024. ❤️","Nooo 😭. Your girlfriend remembers. Try again."],
["quiz","Level 3 — The Big Question 💍","When did TIBS ask his girl to be his girlfriend?",["October 13, 2024","January 9, 2025 ❤️","Valentine’s Day","When he finally got brave 😂"],1,"January 9, 2025. And from there… history. 🥹❤️","SIRRRR. You were there. 😂 Try again."],
["quiz","Level 4 — Long Distance 🌍","Where did our long-distance chapter take us?",["Lagos & Abuja","Lagos & Port Harcourt ❤️","Port Harcourt & Ibadan","The moon & Mars"],1,"Lagos ↔ Port Harcourt. Distance changed the location, not the love. ❤️","The girlfriend’s legal team has concerns. 😭 Try again."],
["quiz","Level 5 — The Starrrr Boy ⭐","What is TIBS officially known as?",["A regular guy","The chairman 😂","My starrrr boy ⭐","Mr. Serious"],2,"STAR. RRRR. BOYYYYY. ⭐❤️","That answer is suspicious. 😭"],
["quiz","Level 6 — Criminal Activity 🚨","What is one of TIBS’s documented talents?",["Stealing his girl’s food 🍟","Stealing cars","Stealing Wi-Fi","Stealing the remote"],0,"Caught in 4K. 🍟😂","We both know the correct answer. 😂"],
["quiz","Level 7 — Attention Criminal 👀","What else does this man have a world-class record for?",["Stealing attention ❤️","Stealing socks","Stealing pillows","Stealing passwords"],0,"Attention: successfully stolen. Heart: permanently stolen. 😭❤️","Nice try, boyfriend. 😂"],
["quiz","Level 8 — Certified Comedian 😂","What is TIBS ridiculously good at?",["Making his girl laugh ❤️","Doing laundry","Cooking five-course meals","Being quiet for 24 hours 😂"],0,"Exactly. You have a dangerous talent for making me laugh. 😂❤️","BE SERIOUS. 😭"],
["letter","Level 9 — Boyfriend Court 👑","The court has reviewed the evidence. TIBS has been found guilty of being a major part of his girl’s happiness.","ACCEPT THE VERDICT ❤️"],
["badges","Level 10 — Achievements Unlocked 🏆","⭐ Starrrr Boy|😂 Certified Laugh Maker|🍟 Professional Food Thief|👀 Attention Criminal|🌍 Long-Distance Survivor|❤️ Permanent Heart Occupant","CONTINUE →"],
["quiz","Level 11 — The Soft Question 🥹","What does distance change about us?",["Everything","Nothing about how much I love you ❤️","How much we laugh","Our relationship status"],1,"Exactly. Distance is a location. It is not a measurement of love. ❤️","Nope. You know your girl better than that. 🥹"],
["quiz","Level 12 — Dangerous Question 👀","If your girlfriend suddenly appeared beside you right now, what happens first?",["A hug that lasts way too long 🥹❤️","Pretend to act normal 😂","Ask what she brought to eat","All of the above because you know us 😂"],3,"Correct answer: probably all of the above. 😂❤️","Hmmmm. Try again, boyfriend. 😌"],
["letter","Level 13 — A Little Thank You 🎁","TIBS, I really want you to know how much I appreciate the package you got for me. 🥹❤️ It was not just about the things inside. It was the thought, the effort, and the fact that you took the time to make me feel loved and remembered. I notice those things. I appreciate you more than I can properly put into words, and I never want you to think your effort goes unnoticed.","I HEAR YOU, BABY ❤️"],
["letter","Level 14 — From Your Girl 💌","I love you. A lot. More than I can fit into a tiny game like this. ❤️ I appreciate the way you make me laugh, the memories we have made, the effort you put into us, and simply having you as my person. Even when distance is annoying, I still look forward to the day we can be in the same place again.","KEEP GOING 🥹"],
["quiz","Level 15 — The Forever Question 🔐","Who has TIBS’s heart?",["Nobody","His beautiful queen 👑❤️","His food","The Wi-Fi"],1,"Correct. And she has yours too. ❤️","BOYFRIEND. 😭"],
["letter","Level 16 — The Real Achievement 🏆","Your biggest achievement is not a trophy. It is not a record. It is not anything money can buy. It is the love we have built, the laughter we share, and the fact that somehow, out of all the people in the world, it became US. ❤️","ONE MORE…"],
["quiz","Level 17 — Final Check ❤️","Complete this sentence: “I’m really, really glad…”",["it’s Friday","it’s food","it’s you ❤️","it’s over 😂"],2,"YES. It’s you. Always you. 🥹❤️","I’m giving you one more chance. 😂"]
];let i=0;
function prog(){return `<div class="progress"><div class="bar" style="width:${Math.round(i/18*100)}%"></div></div>`}
function render(){let s=stages[i];if(!s){final();return}if(s[0]==="quiz"){screen.className="hero";screen.innerHTML=prog()+`<div class="eyebrow">${s[1]}</div><h2>${s[2]}</h2><div id="choices"></div><p class="tiny" id="feedback"></p>`;s[3].forEach((o,n)=>{let b=document.createElement("button");b.className="choice";b.textContent=o;b.onclick=()=>answer(n,s);document.getElementById("choices").appendChild(b)});return}if(s[0]==="letter"){screen.className="hero";screen.innerHTML=prog()+`<div class="eyebrow">${s[1]}</div><h2>❤️</h2><div class="card"><p class="big">${s[2]}</p><button class="btn" id="next">${s[3]}</button></div>`;document.getElementById("next").onclick=()=>{i++;render()};return}screen.className="hero";screen.innerHTML=prog()+`<div class="eyebrow">${s[1]}</div><h2>You earned these. 😌</h2><div class="card">${s[2].split("|").map(x=>`<span class="badge">${x}</span>`).join("")}</div><button class="btn" id="next">${s[3]}</button>`;document.getElementById("next").onclick=()=>{i++;render()}}
function answer(n,s){let f=document.getElementById("feedback"),bs=[...document.querySelectorAll(".choice")];bs.forEach(b=>b.disabled=true);if(n===s[4]){f.textContent=s[5];setTimeout(()=>{i++;render()},850)}else{f.textContent=s[6];screen.classList.add("shake");setTimeout(()=>screen.classList.remove("shake"),400);setTimeout(()=>{bs.forEach(b=>b.disabled=false);f.textContent="Try again, boyfriend. 😭"},850)}}
function final(){screen.className="final";screen.innerHTML=`<span class="heart">👑❤️</span><div class="eyebrow">🏆 BOYFRIEND’S DAY COMPLETE</div><h2>You did it, TIBS.</h2><p class="big">TIBS has officially completed the TIBS Boyfriend Experience™.</p><div class="card"><p>Boyfriend: ✅<br>Starrrr boy: ✅<br>Professional food thief: ✅<br>Attention thief: ✅<br>Makes his girl laugh: ✅<br>Has her heart: 1000000% ✅</p></div><div class="card"><p class="big">Happy Boyfriend’s Day, my baby. 🥹❤️ Thank you for loving me, choosing me, supporting me, making me laugh, thinking of me, and being you. Thank you again for the package you got for me. It genuinely made me feel loved and appreciated, and I hope you know how much that means to me. I love you more than this little game could ever explain. You are my starrrr boy, my person, and my forever love. ❤️</p><p class="big">— Your beautiful queen 👑❤️</p></div><button class="btn alt" id="restart">PLAY IT AGAIN 😂</button>`;document.getElementById("restart").onclick=()=>{i=0;render()}}
screen.innerHTML=`<span class="heart">💌</span><div class="eyebrow">Boyfriend’s Day Special</div><h1>The TIBS<br>Boyfriend Experience™</h1><p class="big">A very serious evaluation of one very important boyfriend. 😌❤️</p><p>There will be memories. There will be questions. There will be allegations about stolen food. There may even be feelings. 😂</p><button class="btn" id="start">START THE EXPERIENCE ❤️</button>`;document.getElementById("start").onclick=()=>{i=0;render()};})();
</script></body></html>
